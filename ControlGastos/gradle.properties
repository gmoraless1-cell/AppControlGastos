# Opciones de la JVM para el Gradle Daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compilacion en paralelo de modulos independientes.
org.gradle.parallel=true

# AndroidX (obligatorio en proyectos modernos).
android.useAndroidX=true

# Kotlin estilo de codigo oficial.
kotlin.code.style=official

# R class no transitiva: compilaciones mas rapidas.
android.nonTransitiveRClass=true
